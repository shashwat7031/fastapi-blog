[project]
name = "fastapi-blog"
version = "0.1.0"
description = "A full-stack blog built with FastAPI, async SQLAlchemy and Jinja2"
readme = "README.md"
authors = [
    { name = "Shashwat", email = "shashwatjha384@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi[standard]>=0.141.1",
    "greenlet>=3.5.4",
    "jinja2>=3.1.6",
    "pillow>=12.3.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.2",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.52.0",
]
